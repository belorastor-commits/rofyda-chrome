<style>
/* ───────────────────────────── theme ─────────────────────────────
   Variant themes live in the config block. This is ROFYDA CHROME. */
:root{
  --ivory:#F2EEE7;
  --ivory-deep:#E8E2D8;
  --ink:#1A1614;
  --burgundy:#5A1620;
  --taupe:#B3A695;
  --chrome-a:#CFC7BA;
  --chrome-b:#F0EBE2;
  --chrome-c:#A79C8D;
  --line:rgba(26,22,20,.14);
  --serif:"Bodoni Moda",Didot,Georgia,serif;
  --sans:"Jost",system-ui,sans-serif;
  --pad:clamp(22px,6vw,72px);
}

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  background:var(--ivory);color:var(--ink);
  font-family:var(--sans);font-weight:300;
  font-size:17px;line-height:1.7;
  overflow-x:hidden;
}
body.is-sealed{overflow:hidden;height:100svh}
img{display:block;width:100%;height:100%;object-fit:cover}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
a{color:inherit}

h1,h2,h3,.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.015em}
.label{
  font-size:12px;letter-spacing:.26em;text-transform:uppercase;
  color:var(--taupe);font-weight:400;
}
.rule{height:1px;background:var(--line);width:100%}
.chrome-rule{
  height:1px;width:72px;
  background:linear-gradient(90deg,transparent,var(--chrome-c),var(--chrome-b),var(--chrome-c),transparent);
}

/* ═══════════════ ROFYDA ENVELOPE · reusable opening component ═══════════════
   Self-contained. Reads its colours from the component variables below, which
   fall back to whichever ROFYDA theme is active. Drop this block, the markup
   marked ROFYDA ENVELOPE, and its init function into any ROFYDA product.
   Nothing here knows anything about weddings — only paper, folds and timing. */
#gate{
  --env-paper:var(--ivory);
  --env-paper-2:var(--ivory-deep);
  --env-flap:var(--ivory-deep);
  --env-seal:var(--burgundy);
  --env-speed:1;
  --t-flap:calc(.92s * var(--env-speed));
  --t-card:calc(.95s * var(--env-speed));
  --d-flap:calc(.26s * var(--env-speed));
  --d-card:calc(1.18s * var(--env-speed));

  position:fixed;inset:0;z-index:90;
  background:var(--ivory);
  display:grid;place-items:center;
  padding:var(--pad);
  perspective:1500px;
  transition:opacity calc(.7s * var(--env-speed)) ease,
             transform calc(.7s * var(--env-speed)) cubic-bezier(.4,0,.2,1);
}
#gate.is-done{opacity:0;transform:scale(1.06);pointer-events:none}

.env{
  position:relative;
  width:min(86vw,384px);
  aspect-ratio:1.42;
  perspective:1400px;
  background:none;border:none;padding:0;cursor:pointer;
  animation:envLift 3.6s ease-in-out 1.6s infinite;
}
@keyframes envLift{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#gate.is-open .env{animation:none}

/* paper — two soft passes of grain, never a texture image */
.paper{
  background:
    repeating-linear-gradient(94deg,rgba(0,0,0,.014) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(4deg,rgba(255,255,255,.35) 0 1px,transparent 1px 4px),
    var(--env-paper);
}

.env__back{
  position:absolute;inset:0;z-index:0;
  border-radius:3px;
  box-shadow:0 42px 70px -34px rgba(26,22,20,.55),0 2px 5px rgba(26,22,20,.08);
}
.env__back::after{
  content:"";position:absolute;inset:0;border-radius:3px;
  background:radial-gradient(120% 90% at 50% 0%,rgba(0,0,0,.05),transparent 62%);
}

/* THE SLOT — everything above the envelope's top edge is cut away, so the
   card is genuinely invisible while it is inside. The cut is released only
   once the flap has finished falling back, one frame before the card moves. */
.env__slot{
  position:absolute;inset:0;z-index:1;
  clip-path:inset(0 -40% -40% -40%);
  transition:clip-path 0s linear calc(1.16s * var(--env-speed));
}
#gate.is-open .env__slot{clip-path:inset(-220% -40% -40% -40%)}

/* the card that rises */
.env__card{
  position:absolute;left:6%;width:88%;height:128%;bottom:6%;
  transform:translateY(0);
  background:var(--env-paper-2);
  border-radius:2px;
  box-shadow:0 -3px 14px rgba(26,22,20,.10);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  gap:8px;padding:11% 8% 0;text-align:center;
  transition:transform var(--t-card) cubic-bezier(.22,1,.28,1) var(--d-card);
}
#gate.is-open .env__card{transform:translateY(-64%)}
.env__card .kicker{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--taupe)}
.env__card .cnames{
  font-family:var(--serif);font-size:clamp(1.5rem,7.2vw,2.1rem);
  line-height:1.04;letter-spacing:-.02em;
}
.env__card .cnames em{
  display:block;font-style:italic;font-size:.42em;
  color:var(--env-seal);letter-spacing:0;margin:.1em 0;
}
.env__card .cdate{font-size:11px;letter-spacing:.28em;color:var(--ink)}
.env__card .hair{
  width:38px;height:1px;margin-top:4px;
  background:linear-gradient(90deg,transparent,var(--chrome-c),transparent);
}

/* the front pocket — a solid panel, opaque edge to edge. The V is a folded
   seam drawn on top of it, not a hole cut through it. */
.env__front{
  position:absolute;inset:0;z-index:2;
  background:
    linear-gradient(180deg,rgba(0,0,0,.05),transparent 30%),
    repeating-linear-gradient(94deg,rgba(0,0,0,.014) 0 1px,transparent 1px 3px),
    var(--env-paper);
  border-radius:3px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  gap:6px;padding:0 12% 11%;
}
.env__front::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  clip-path:polygon(0 0,50% 34%,100% 0,100% 1.5%,50% 35.5%,0 1.5%);
  background:rgba(26,22,20,.11);
}
.env__front .fnames{
  font-family:var(--serif);font-size:clamp(1.15rem,5.6vw,1.6rem);
  line-height:1.06;letter-spacing:-.015em;text-align:center;
}
.env__front .fnames em{
  display:block;font-style:italic;font-size:.46em;
  color:var(--env-seal);letter-spacing:0;margin:.08em 0;
}
.env__front .fdate{font-size:10px;letter-spacing:.3em;color:var(--taupe)}

/* the flap — sits above everything while sealed, drops behind once it has
   swung past the vertical, so the rising card passes in front of it */
.env__flap{
  position:absolute;top:0;left:0;width:100%;height:46%;z-index:3;
  transform-origin:top center;
  transform:rotateX(0deg);
  clip-path:polygon(0 0,100% 0,50% 100%);
  background:
    linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.07)),
    repeating-linear-gradient(94deg,rgba(0,0,0,.014) 0 1px,transparent 1px 3px),
    var(--env-flap);
  transition:transform var(--t-flap) cubic-bezier(.62,0,.24,1) var(--d-flap),
             z-index 0s linear calc(.74s * var(--env-speed));
}
#gate.is-open .env__flap{transform:rotateX(-174deg);z-index:0}

/* seal */
.env__seal{
  position:absolute;top:40%;left:50%;z-index:6;
  transform:translate(-50%,-50%) scale(1);
  width:clamp(46px,13vw,58px);aspect-ratio:1;border-radius:50%;
  background:var(--env-seal);
  border:1px solid var(--chrome-b);
  box-shadow:0 3px 9px rgba(26,22,20,.3),inset 0 0 0 3px rgba(255,255,255,.11);
  display:grid;place-items:center;
  font-family:var(--serif);font-size:13px;letter-spacing:.02em;
  color:var(--ivory);
  transition:opacity calc(.34s * var(--env-speed)) ease,
             transform calc(.44s * var(--env-speed)) cubic-bezier(.5,0,.75,0);
}
#gate.is-open .env__seal{opacity:0;transform:translate(-50%,-66%) scale(.74) rotate(-7deg)}

/* wordmark + call to action */
.env__mark{
  position:absolute;top:clamp(26px,7vh,54px);left:50%;transform:translateX(-50%);
  font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--taupe);
  transition:opacity .4s ease;
}
.env__cta{
  position:absolute;bottom:clamp(30px,9vh,64px);left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:10px;
  font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink);
  transition:opacity .4s ease;white-space:nowrap;
}
.env__cta i{
  display:block;width:44px;height:1px;
  background:linear-gradient(90deg,transparent,var(--chrome-c),transparent);
}
#gate.is-open .env__cta,#gate.is-open .env__mark{opacity:0}

@media (prefers-reduced-motion:reduce){
  .env{animation:none}
  #gate.is-open .env__flap{transform:rotateX(-174deg);z-index:0}
  #gate.is-open .env__card{transform:translateY(-64%)}
  #gate.is-open .env__slot{clip-path:inset(-220% -40% -40% -40%)}
}

/* ───────────────────────────── nav ───────────────────────────── */
#nav{
  position:fixed;left:0;right:0;top:0;z-index:60;
  display:flex;justify-content:space-between;align-items:center;
  padding:16px var(--pad);
  background:rgba(242,238,231,.86);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  transform:translateY(-102%);transition:transform .6s cubic-bezier(.19,1,.22,1);
}
#nav.show{transform:none}
#nav .wordmark{font-size:11px;letter-spacing:.38em;text-transform:uppercase;color:var(--taupe)}
#nav a{
  font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  text-decoration:none;padding:6px 0;margin-left:22px;
  border-bottom:1px solid transparent;transition:border-color .25s ease;
}
#nav a:hover,#nav a:focus-visible{border-color:var(--burgundy)}
#nav .links{display:flex}
@media (max-width:640px){#nav .links a:nth-child(n+3){display:none}}

/* ─────────────────────────── sections ─────────────────────────── */
section{padding:clamp(84px,15vh,150px) var(--pad);position:relative}
.wrap{max-width:1080px;margin:0 auto}
.narrow{max-width:620px;margin:0 auto}
.center{text-align:center}

.reveal{opacity:0;transform:translateY(26px);transition:opacity .9s ease,transform .9s cubic-bezier(.19,1,.22,1)}
.reveal.in{opacity:1;transform:none}

/* 02 save the date */
/* ───────────────── 02 · HERO · the opening spread ─────────────────
   The card inside the envelope was centred. This is deliberately not, so it
   reads as the page turn rather than a second printing of the same card.
   Everything here waits for the envelope: the animations are keyed to
   body:not(.is-sealed), which the envelope already removes when it leaves.
   No change was needed to the envelope itself. */
.hero{
  min-height:100svh;
  display:flex;align-items:center;
  padding:clamp(96px,15vh,150px) var(--pad) clamp(84px,12vh,130px);
  position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(74% 56% at 30% 40%,rgba(255,255,255,.6),transparent 72%);
}
.hero__inner{position:relative;z-index:2;max-width:840px;padding-left:clamp(20px,6vw,44px)}

/* the spine — a magazine edge, drawn once */
.hero__spine{
  position:absolute;left:0;top:0;bottom:0;width:clamp(26px,7vw,48px);
  display:flex;align-items:center;justify-content:center;z-index:2;
}
.hero__spine::before{
  content:"";position:absolute;top:13%;bottom:13%;left:50%;width:1px;
  background:linear-gradient(180deg,transparent,var(--chrome-c) 22%,var(--chrome-c) 78%,transparent);
  transform:scaleY(0);transform-origin:top;
  transition:transform 1.5s cubic-bezier(.19,1,.22,1) .3s;
}
.hero__spine span{
  position:relative;writing-mode:vertical-rl;transform:rotate(180deg);
  font-size:10px;letter-spacing:.36em;text-transform:uppercase;color:var(--taupe);
  background:var(--ivory);padding:16px 0;white-space:nowrap;
  opacity:0;transition:opacity .9s ease 1.05s;
}
body:not(.is-sealed) .hero__spine::before{transform:scaleY(1)}
body:not(.is-sealed) .hero__spine span{opacity:1}

.hero__kicker{
  font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--taupe);
  margin-bottom:clamp(18px,4vw,28px);
  opacity:0;transition:opacity .8s ease .15s;
}
body:not(.is-sealed) .hero__kicker{opacity:1}

/* the names — set from a baseline, the way type is pressed onto paper */
.hero__names{
  font-family:var(--serif);font-weight:400;
  font-size:calc(clamp(3rem,16vw,7.2rem) * var(--hero-scale,1));
  line-height:.86;letter-spacing:-.045em;
}
.hero__names .line{display:block;overflow:hidden;padding-bottom:.05em}
.hero__names .line > *{
  display:block;transform:translateY(110%);
  transition:transform 1.15s cubic-bezier(.19,1,.22,1);
}
.hero__names .line:nth-child(2) > *{transition-delay:.13s}
.hero__names .line:nth-child(3) > *{transition-delay:.26s}
body:not(.is-sealed) .hero__names .line > *{transform:none}
.hero__names .amp{font-size:.28em;line-height:1.5;padding-left:.5em}
.hero__names .amp em{font-style:italic;color:var(--burgundy);letter-spacing:0}

/* the dateline */
.hero__dateline{
  display:flex;align-items:center;gap:clamp(10px,3vw,16px);
  margin-top:clamp(28px,5vw,42px);
  font-size:12px;letter-spacing:.32em;text-transform:uppercase;
  opacity:0;transform:translateY(14px);
  transition:opacity .9s ease .6s,transform .9s cubic-bezier(.19,1,.22,1) .6s;
}
.hero__dateline i{display:block;height:1px;width:clamp(22px,7vw,56px);flex:none}
.hero__dateline i:first-child{background:linear-gradient(90deg,transparent,var(--chrome-c))}
.hero__dateline i:last-child{background:linear-gradient(90deg,var(--chrome-c),transparent)}
body:not(.is-sealed) .hero__dateline{opacity:1;transform:none}

.hero blockquote{
  font-family:var(--serif);font-style:italic;
  font-size:clamp(1.05rem,4.4vw,1.42rem);line-height:1.6;
  max-width:30ch;margin-top:clamp(26px,4vw,36px);
  opacity:0;transform:translateY(16px);
  transition:opacity 1s ease .8s,transform 1s cubic-bezier(.19,1,.22,1) .8s;
}
body:not(.is-sealed) .hero blockquote{opacity:1;transform:none}

/* a light travelling down a hairline — the only looping motion on the page */
.hero__cue{
  position:absolute;left:50%;transform:translateX(-50%);bottom:clamp(26px,5vh,46px);
  width:1px;height:clamp(40px,7vh,64px);overflow:hidden;z-index:2;
  background:rgba(26,22,20,.10);
  opacity:0;transition:opacity 1s ease 1.35s;
}
.hero__cue span{
  display:block;width:100%;height:44%;background:var(--burgundy);
  animation:cueRun 2.8s cubic-bezier(.55,0,.45,1) infinite;
}
@keyframes cueRun{0%{transform:translateY(-130%)}62%,100%{transform:translateY(270%)}}
body:not(.is-sealed) .hero__cue{opacity:1}

@media (min-width:900px){
  .hero__names .amp{padding-left:1.1em}
  .hero blockquote{margin-left:.1em}
}

/* 03 details */
.details{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:44px}
.card{background:var(--ivory);padding:clamp(30px,6vw,48px)}
.card h3{font-size:clamp(1.6rem,7vw,2.1rem);margin:14px 0 20px}
.card dl{display:grid;gap:14px}
.card dt{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--taupe)}
.card dd{font-size:17px;line-height:1.5}
@media (min-width:820px){.details{grid-template-columns:1fr 1fr}}

.link-btn{
  display:inline-block;margin-top:26px;padding:15px 30px;
  border:1px solid var(--ink);text-decoration:none;
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  transition:background .28s ease,color .28s ease;
}
.link-btn:hover,.link-btn:focus-visible{background:var(--ink);color:var(--ivory)}

/* 04 countdown */
.countdown{
  background:var(--burgundy);color:var(--ivory);
  padding-top:clamp(54px,9vh,100px);
  padding-bottom:clamp(54px,9vh,100px);
}
.countdown .label{color:rgba(242,238,231,.62)}
.countdown .chrome-rule{margin:18px auto 0}
.countdown .narrow{max-width:760px}
.clock{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:clamp(4px,1.6vw,26px);
  max-width:720px;margin:clamp(24px,5vw,34px) auto 0;
  font-variant-numeric:tabular-nums;
}
.clock div{min-width:0;text-align:center}
.clock b{
  display:block;font-family:var(--serif);font-weight:400;
  font-size:clamp(1.8rem,9vw,4.2rem);line-height:1;
  letter-spacing:-.04em;font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.clock span{
  display:block;margin-top:clamp(6px,1.6vw,12px);
  font-size:clamp(8px,2.4vw,11px);
  letter-spacing:clamp(.05em,.5vw,.22em);
  text-transform:uppercase;color:rgba(242,238,231,.62);
  white-space:nowrap;
}
/* the day itself — one line of type, not a four-column grid */
.clock.done{
  display:block;max-width:none;
  font-family:var(--serif);font-size:clamp(1.5rem,7vw,2.4rem);font-style:italic;
}

/* 05 story */
.story{display:grid;gap:clamp(28px,5vw,56px);align-items:center}
@media (min-width:900px){.story{grid-template-columns:1.05fr .95fr}}
.story .prose p + p{margin-top:1rem}
.story .stack{display:grid;gap:14px}
.story .stack .small{width:62%;margin-left:auto}

/* 06 gallery */
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,2vw,16px);margin-top:44px}
.gallery .ph{aspect-ratio:3/4}
.gallery .ph:nth-child(1){grid-column:1/-1;aspect-ratio:16/10}
@media (min-width:820px){
  .gallery{grid-template-columns:repeat(3,1fr)}
  /* fixed row height beats aspect-ratio here: five pictures of unknown shape
     still line up in two clean rows */
  .gallery .ph{aspect-ratio:auto;height:clamp(250px,25vw,370px)}
  .gallery .ph:nth-child(1){grid-column:1/3}
}

/* image frames — the frame owns the crop, so any picture the customer drops
   in keeps the layout intact. An empty slot is a quiet tonal panel with a
   small chrome mark: finished-looking, never a broken-image state. */
.ph{position:relative;background:var(--ivory-deep);overflow:hidden}
/* In a portrait wedding photograph the faces sit above the middle, so a tall
   frame holds its focus slightly high. Wide frames stay centred. */
.ph img{width:100%;height:100%;object-fit:cover;object-position:center 25%}
.ph.wide img{object-position:center}
.gallery .ph:nth-child(1) img{object-position:center 35%}
.ph[data-empty="1"]{
  background:
    linear-gradient(135deg,rgba(255,255,255,.55),transparent 48%),
    radial-gradient(120% 90% at 50% 0%,rgba(0,0,0,.035),transparent 62%),
    var(--ivory-deep);
}
.ph[data-empty="1"]::before,
.ph[data-empty="1"]::after{
  content:"";position:absolute;top:50%;left:50%;
  background:var(--chrome-c);opacity:.55;
}
.ph[data-empty="1"]::before{width:24px;height:1px;transform:translate(-50%,-50%)}
.ph[data-empty="1"]::after{width:1px;height:24px;transform:translate(-50%,-50%)}
.ph.tall{aspect-ratio:3/4}
.ph.wide{aspect-ratio:4/3}

/* 07 rsvp */
.rsvp{background:var(--ivory-deep)}
form{margin-top:40px;display:grid;gap:22px;max-width:560px;margin-inline:auto;text-align:left}
label{display:block;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--taupe);margin-bottom:8px}
input,select,textarea{
  width:100%;font:inherit;font-size:17px;color:var(--ink);
  background:transparent;border:none;border-bottom:1px solid var(--line);
  padding:11px 0;border-radius:0;
}
input:focus,select:focus,textarea:focus{outline:none;border-bottom-color:var(--burgundy)}
textarea{resize:vertical;min-height:82px}
.attend{display:grid;gap:10px}
@media (min-width:520px){.attend{grid-template-columns:1fr 1fr}}
.attend button{
  padding:17px 14px;border:1px solid var(--line);
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  transition:all .25s ease;
}

(function(){

const C=WEDDING_CONFIG, $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

rs.setProperty("--ink",t.ink);     rs.setProperty("--burgundy",t.accent);
rs.setProperty("--taupe",t.taupe); rs.setProperty("--chrome-a",t.ca);
rs.setProperty("--chrome-b",t.cb); rs.setProperty("--chrome-c",t.cc);

/* text */
["#g1","#s1"].forEach(s=>put(s,C.nameOne));
["#g2","#s2"].forEach(s=>put(s,C.nameTwo));
["#gj","#sj"].forEach(s=>put(s,C.joiner));

put("#ctaText",C.openLabel);
put("#h-slug",C.venue.name+" · "+String(C.dateISO).slice(0,4));
put("#k1",C.nameOne); put("#k2",C.nameTwo); put("#kj",C.joiner); put("#kd",C.dateStamp);
put("#c-venue",C.ceremony.venue); put("#c-time",C.ceremony.time); put("#c-addr",C.ceremony.address);
put("#r-venue",C.reception.venue); put("#r-time",C.reception.time); put("#r-addr",C.reception.address);
$("#c-map").href=C.ceremony.mapUrl; $("#r-map").href=C.reception.mapUrl; $("#v-map").href=C.venue.mapUrl;
put("#st-title",C.storyTitle);
$("#st-body").innerHTML=C.story.map(p=>`<p></p>`).join("");
$$("#st-body p").forEach((p,i)=>p.textContent=C.story[i]);
put("#v-name",C.venue.name); put("#v-addr",C.venue.address);
put("#v-time",C.venue.time); put("#v-dir",C.venue.directions);
put("#d-code",C.dressCode); put("#d-note",C.dressNote);
put("#cl-text",C.closing); put("#cl-date",C.dateStamp);
put("#cl-names",C.nameOne+" "+C.joiner+" "+C.nameTwo);
put("#rs-deadline",C.rsvp.deadline);
document.title=C.nameOne+" & "+C.nameTwo+" — "+C.dateLong;

/* wording */
const T=C.text||{};
[["t-herokicker","heroKicker"],["t-cardkicker","cardKicker"],["t-details","detailsLabel"],
 ["t-ceremony","ceremonyLabel"],["t-reception","receptionLabel"],["t-countdown","countdownLabel"],
 ["t-story","storyLabel"],["t-gallery","galleryLabel"],["t-rsvp","rsvpLabel"],
 ["t-rsvpheading","rsvpHeading"],["t-venue","venueLabel"],["t-dress","dressLabel"],
 ["t-footer","footer"],["rsvpSubmit","submitButton"],
 ["c-map","mapButton"],["r-map","mapButton"],["v-map","mapButton"]
].forEach(([id,key])=>put("#"+id,T[key]||""));

/* long names must not run off a 360px screen — the frame stays, the type
   steps down only as far as the longest name actually requires */
(function fitNames(){
  const longest=Math.max(String(C.nameOne).length,String(C.nameTwo).length);
  if(longest>8) document.documentElement.style.setProperty("--hero-scale",Math.max(.62,8/longest).toFixed(3));
})();

/* photos — a filename shows the photo, "" shows a labelled placeholder */
function fill(node,file,alt){
  if(!node) return;
  if(!file){ node.setAttribute("data-empty","1"); return; }
  node.removeAttribute("data-empty");
  const i=new Image();
  i.alt=alt||""; i.loading="lazy"; i.decoding="async";
  /* a filename that never loads must not leave a torn frame open */
  i.onerror=()=>{ i.remove(); node.setAttribute("data-empty","1"); };
  i.src="images/"+file;
  node.appendChild(i);
}
fill($("#im-story1"),C.images.story,C.nameOne+" and "+C.nameTwo);
/* storyDetail is optional — with no file, the frame leaves rather than
   sitting there as an empty panel */
if(C.images.storyDetail) fill($("#im-story2"),C.images.storyDetail,"");
else { const n=$("#im-story2"); if(n) n.remove(); }
fill($("#im-venue"),C.images.venue,C.venue.name);
const g=$("#gallery");
(C.images.gallery||[]).forEach(f=>{
  const d=document.createElement("div");
  d.className="ph";
  g.appendChild(d); fill(d,f,"");
});

/* countdown */
const when=new Date(C.dateISO).getTime(), clock=$("#clock");
(function tick(){
  if(isNaN(when)){clock.innerHTML="<div>Check dateISO — use YYYY-MM-DDTHH:MM:SS</div>";return;}
  const gap=when-Date.now();
  if(gap<=0){clock.className="clock done";clock.textContent=C.dayOfMessage;return;}
  const d=Math.floor(gap/864e5),h=Math.floor(gap%864e5/36e5),
        m=Math.floor(gap%36e5/6e4),s=Math.floor(gap%6e4/1e3),p=n=>String(n).padStart(2,"0");
  clock.innerHTML=
    `<div><b>${d}</b><span>Days</span></div><div><b>${p(h)}</b><span>Hours</span></div>`+
    `<div><b>${p(m)}</b><span>Minutes</span></div><div><b>${p(s)}</b><span>Seconds</span></div>`;
  setTimeout(tick,1000);
})();

/* ═════════════ ROFYDA ENVELOPE · init ═════════════
   Three beats: the seal releases, the flap falls back, the card rises.
   Then the envelope steps aside and the site is already there. */
(function envelope(){
  const E=C.envelope||{}, gate=$("#gate"), g=gate.style;
  const speed=Number(E.speed)>0?Number(E.speed):1;

  g.setProperty("--env-speed",speed);
  if(E.paperColor) g.setProperty("--env-paper",E.paperColor);
  if(E.cardColor)  g.setProperty("--env-paper-2",E.cardColor);
  if(E.flapColor)  g.setProperty("--env-flap",E.flapColor);
  if(E.sealColor)  g.setProperty("--env-seal",E.sealColor);

  $("#envSeal").textContent=E.monogram||(C.nameOne[0]+"·"+C.nameTwo[0]);

  let opened=false;
  function open(){
    if(opened)return; opened=true;
    gate.classList.add("is-open");
    /* the card finishes rising, then the envelope leaves */
    setTimeout(()=>{
      gate.classList.add("is-done");
      document.body.classList.remove("is-sealed");
    },2280*speed);
    setTimeout(()=>{$("#nav").classList.add("show"); gate.remove();},3050*speed);
  }
  $("#envelope").addEventListener("click",open);
  gate.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" ")open();});
})();

if("IntersectionObserver" in window){
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}
  }),{threshold:.14});
  $$(".reveal").forEach(el=>io.observe(el));
} else $$(".reveal").forEach(el=>el.classList.add("in"));

/* RSVP — honest about where replies go */
if(C.rsvp && C.rsvp.enabled===false){
  const sec=$("#rsvp"); if(sec) sec.remove();
  const link=document.querySelector('#nav a[href="#rsvp"]'); if(link) link.remove();
}
let attendance="";
$$(".attend button").forEach(b=>b.addEventListener("click",()=>{
  $$(".attend button").forEach(o=>o.setAttribute("aria-pressed","false"));
  b.setAttribute("aria-pressed","true"); attendance=b.dataset.val;
}));

const note=$("#rs-note"), form=$("#rsvpForm"), R=C.rsvp||{};
if(form){

/* The owner needs to know an endpoint is missing. A guest does not — so the
   reminder goes to the browser console, never onto the page. */
if(!R.endpoint) console.warn(
  "[ROFYDA] No RSVP endpoint is set. Replies will open in the guest's email app "+
  "and be sent to "+(R.email||"the address in WEDDING_CONFIG")+". To collect them "+
  "in one list instead, add your own form endpoint to rsvp.endpoint.");

function thankGuest(){
  form.innerHTML='<div class="rsvp-done"><b></b><span></span></div>';
  form.querySelector("b").textContent=T.thankYou||"Thank you.";
  form.querySelector("span").textContent=T.thankYouSub||"";
}

form.addEventListener("submit",async e=>{
  e.preventDefault();
  const name=$("#f-name").value.trim(), email=$("#f-email").value.trim();
  if(!name||!email||!attendance){
    note.className="form-note warn";
    note.textContent="Please add your name, your email, and whether you can join us.";
    return;
  }
  const data={name,email,attendance,guests:$("#f-guests").value,message:$("#f-msg").value.trim()};

  /* No endpoint: hand the reply to the guest's email app. It genuinely works,
     and nothing pretends to have been stored. */
  if(!R.endpoint){
    const body=["Name: "+data.name,"Email: "+data.email,"Attendance: "+data.attendance,
                "Guests: "+data.guests,"Message: "+data.message].join("\n");
    location.href="mailto:"+encodeURIComponent(R.email||"")+
      "?subject="+encodeURIComponent("RSVP — "+data.name)+
      "&body="+encodeURIComponent(body);
    note.className="form-note";
    note.textContent="Your email is ready — press send to complete your reply.";
    return;
  }

  const btn=$("#rsvpSubmit"); btn.disabled=true; btn.textContent="Sending";
  try{
    const r=await fetch(R.endpoint,{
      method:R.method||"POST",
      headers:{"Content-Type":"application/json",Accept:"application/json"},
      body:JSON.stringify(data)
    });
    if(!r.ok) throw new Error(r.status);
    thankGuest();
  }catch(err){
    btn.disabled=false; btn.textContent=T.submitButton||"Submit RSVP";
    note.className="form-note warn";
    note.textContent="That reply didn't go through. Please try once more."+
      (R.email?" Or email us at "+R.email+".":"");
  }
});
}

/* music — opt-in only, never autoplay */
if(C.audioUrl){
  const el=$("#music"), audio=new Audio(C.audioUrl); audio.loop=true;
  el.classList.add("on");
  el.addEventListener("click",()=>{
    const on=el.getAttribute("aria-pressed")==="true";
    if(on){audio.pause();el.setAttribute("aria-pressed","false");el.setAttribute("aria-label","Play music");}
    else audio.play().then(()=>{el.setAttribute("aria-pressed","true");el.setAttribute("aria-label","Pause music");})
                     .catch(()=>{el.setAttribute("aria-pressed","false");});
  });
}
})();
</script>
</body>
</html>
